# Render Blueprint: free web service (Dockerfile). The database is an external free Neon Postgres,
# so there is no Render database here (Render deletes free databases after 30 days).
# DATABASE_URL (Neon connection string) is a secret: set it in the Render dashboard, never in git.
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
