# Render Blueprint: free web service (Dockerfile) + free Postgres, connected via DATABASE_URL.
# NOTE: Render's free Postgres expires 30 days after creation (14-day grace, then deleted).
# Upgrade the database plan (or point DATABASE_URL at another Postgres) for anything long-lived.
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ajaia-db
          property: connectionString

databases:
  - name: ajaia-db
    plan: free
